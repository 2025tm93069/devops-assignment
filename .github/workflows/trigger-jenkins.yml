name: Trigger Local Jenkins

on:
  push:
    branches:
      - main

jobs:
  trigger-jenkins:
    runs-on: self-hosted

    steps:
      - name: Verify Jenkins authentication
        shell: powershell
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          $credentials = "${env:JENKINS_USER}:${env:JENKINS_TOKEN}"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($credentials)
          $base64 = [Convert]::ToBase64String($bytes)

          $headers = @{
              Authorization = "Basic $base64"
          }

          Write-Host "Checking Jenkins..."

          $response = Invoke-WebRequest `
              -Uri "http://localhost:8080/api/json" `
              -Headers $headers `
              -UseBasicParsing

          Write-Host "Jenkins Status: $($response.StatusCode)"

      - name: Trigger Jenkins Pipeline
        shell: powershell
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          $credentials = "${env:JENKINS_USER}:${env:JENKINS_TOKEN}"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($credentials)
          $base64 = [Convert]::ToBase64String($bytes)

          $headers = @{
              Authorization = "Basic $base64"
          }

          $jenkinsUrl = "http://localhost:8080"
          $jobName = "aceest-app"

          $url = "$jenkinsUrl/job/$jobName/build"

          Write-Host "Triggering Jenkins job: $jobName"

          $response = Invoke-WebRequest `
              -Uri $url `
              -Method POST `
              -Headers $headers `
              -UseBasicParsing

          Write-Host "Jenkins response: $($response.StatusCode)"
          Write-Host "Jenkins build triggered successfully."